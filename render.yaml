services:
  - type: web
    name: trustlens-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    plan: free
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      # Lightweight embeddings via the OpenAI API (no local ML weights).
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # OpenAI-backed entailment classifier used by claim verification.
      - key: OPENAI_NLI_MODEL
        value: gpt-5.6-luna
      - key: NLI_THRESHOLD
        value: "0.70"
      - key: RETRIEVAL_K
        value: "5"
      - key: CLAIM_RETRIEVAL_K
        value: "3"
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://trustlens.vercel.app,https://trustlens-alpha.vercel.app
      # Allows only TrustLens Vercel production/preview URLs in addition to
      # the exact origins above. Update the prefix if the Vercel project name changes.
      - key: CORS_ORIGIN_REGEX
        value: https://trustlens(?:-[a-z0-9-]+)?\.vercel\.app
      # OPENAI_API_KEY must be set manually in the Render dashboard
      # --- Authentication ---
      # AUTH_MODE=prod requires a valid Bearer JWT on every request.
      # JWT_SECRET (HS256 shared secret or RS256/ES256 PEM public key) MUST be
      # set as a secret in the Render dashboard - never commit it to the repo.
      - key: AUTH_MODE
        value: prod
      - key: JWT_ALGORITHMS
        value: HS256,RS256,ES256
      # Target issuer/audience for issued tokens (recommended when using Clerk):
      # - key: JWT_ISSUER
      #   value: https://<your-clerk-domain>/
      # - key: JWT_AUDIENCE
      #   value: <audience-or-empty>

