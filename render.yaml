services:
  - type: web
    name: trustlens-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    plan: free
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      # Lightweight embeddings via the OpenAI API (no local ML weights).
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      # OpenAI-backed entailment classifier used by claim verification.
      - key: OPENAI_NLI_MODEL
        value: gpt-5.6-luna
      - key: NLI_THRESHOLD
        value: "0.70"
      - key: RETRIEVAL_K
        value: "5"
      - key: CLAIM_RETRIEVAL_K
        value: "3"
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://trustlens.vercel.app,https://trustlens-alpha.vercel.app
      # OPENAI_API_KEY must be set manually in the Render dashboard

